name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  queue-tests:
    name: M365 queue (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test scheduling without AD or M365
        shell: powershell
        run: ./tests/M365Queue.Tests.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and queue interface
        run: |
          node --check app.js
          node --check m365-queue.js
          node tests/m365-queue-ui.test.js

  lint:
    name: Lint PowerShell and JavaScript
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -AcceptLicense
        
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          # Executa o analisador apenas para exibir os avisos no log, sem quebrar o pipeline (removido o -EnableExit)
          Invoke-ScriptAnalyzer -Path ./*.ps1 -Recurse

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Lint JavaScript (Basic Syntax Check)
        run: |
          npm init -y
          npm install eslint -g
          # Para um projeto vanilla, podemos usar uma validação sintática básica
          npx eslint app.js --env browser --no-eslintrc --parser-options=ecmaVersion:latest || echo "Lint warnings found, but proceeding."

  build-release:
    name: Create Release Artifact
    runs-on: ubuntu-latest
    needs: [lint, queue-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        
      - name: Package Application
        run: |
          mkdir ADUserCreator-Release
          cp index.html app.js m365-queue.js style.css Server.ps1 M365Queue.ps1 config.json Start.bat Start-Server-Admin.bat ADUserCreator-Release/
          zip -r ADUserCreator-Release.zip ADUserCreator-Release/
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADUserCreator-Release
          path: ADUserCreator-Release.zip
